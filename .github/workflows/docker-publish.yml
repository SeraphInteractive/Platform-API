name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # add linux/arm64 for multi-arch images (arm64 is emulated on GitHub runners, so builds take longer)
  PLATFORMS: linux/amd64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Optional: ask Dokploy to redeploy the Platform-Deployment stack once the image is on GHCR.
    # Set the DOKPLOY_WEBHOOK_URL repository secret (the compose service's webhook url) to enable it.
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io only accepts lowercase image names
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags: latest (main), main, sha-<short>, pr-<n>, and 1.2.3 / 1.2 for v* release tags
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # pull requests only build (no push) to validate the Dockerfile
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Dokploy's compose webhook validates the request like a GitHub push event: the branch in
      # `ref` must be the branch configured on the compose service (Platform-Deployment's main),
      # and a mismatch answers 301, so check for an explicit 200 instead of relying on --fail.
      - name: Redeploy on Dokploy
        if: github.ref == 'refs/heads/main' && env.DOKPLOY_WEBHOOK_URL != ''
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          payload=$(jq --compact-output --null-input \
            --arg ref "refs/heads/main" \
            --arg message "${IMAGE}:sha-${GITHUB_SHA::7} published (${subject:-manual run})" \
            '{ref: $ref, head_commit: {message: $message}, commits: []}')
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "${DOKPLOY_WEBHOOK_URL}" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "${payload}")
          echo "dokploy answered HTTP ${status}: $(cat response.json)"
          test "${status}" = "200"
